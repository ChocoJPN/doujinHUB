<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOUJIN INDEX — FANZA同人 新着・ランキング・有名作家まとめ</title>
  <meta name="description" content="FANZA同人の同人誌・同人音声(ASMR)・CG集の新着、人気ランキング、有名作家・サークル別まとめサイト。" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-hover: #18181c;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #fafafa;
      --text-sub: #a1a1aa;
      --text-muted: #71717a;
      --accent: #e11d48;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* 1. Top Header */
    .header {
      background: var(--surface);
      padding-top: 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 14px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
    }

    .brand-bar {
      width: 5px;
      height: 28px;
      background: var(--accent);
      border-radius: 2px;
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.01em;
      display: block;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--text-sub);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-sub);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .link-mode-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.78rem;
      color: var(--text-sub);
      cursor: pointer;
    }

    .search-box {
      position: relative;
      width: 290px;
      max-width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px 9px 36px;
      font-size: 0.85rem;
      color: var(--text);
      transition: border-color 0.15s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* 2. Main Tab Bar */
    .tab-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18, 18, 21, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .tab-list {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 14px 20px;
      border: none;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.02);
    }

    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
      background: rgba(225, 29, 72, 0.06);
    }

    .count-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 99px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
    }

    /* 3. Sub Genre Bar */
    .subbar {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin-bottom: 24px;
      background: var(--bg);
    }

    .subbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .cat-segment {
      display: inline-flex;
      padding: 4px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      gap: 4px;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 7px 14px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cat-btn:hover {
      color: var(--text);
    }

    .cat-btn.active {
      background: var(--text);
      color: var(--bg);
      font-weight: 700;
    }

    .cat-count {
      font-size: 0.72rem;
      opacity: 0.75;
    }

    .sort-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .result-summary {
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-right: 6px;
    }

    .select-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Active Filter Bar */
    .filter-notice {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(225, 29, 72, 0.1);
      border: 1px solid rgba(225, 29, 72, 0.35);
      border-radius: 10px;
      margin-bottom: 22px;
      font-size: 0.85rem;
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .card-cover {
      height: 195px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background-size: cover;
      background-position: center top;
      position: relative;
      cursor: pointer;
    }

    .card-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(9, 9, 11, 0.65) 0%,
        rgba(9, 9, 11, 0.05) 35%,
        rgba(9, 9, 11, 0.08) 65%,
        rgba(9, 9, 11, 0.82) 100%
      );
      pointer-events: none;
    }

    .cover-top, .cover-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .type-label {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(9, 9, 11, 0.82);
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
    }

    .rank-badge {
      font-size: 0.76rem;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      background: #fafafa;
      color: #09090b;
      margin-right: 6px;
    }

    .discount-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
    }

    .mono-meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      color: #f4f4f5;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .card-body {
      padding: 16px 18px;
    }

    .circle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--text-sub);
      gap: 8px;
    }

    .circle-link {
      background: none;
      border: none;
      color: var(--text-sub);
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .circle-link:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .rating-meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      color: #fbbf24;
      font-weight: 700;
      white-space: nowrap;
    }

    .card-title-link {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.85em;
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 12px;
    }

    .card-title-link:hover {
      color: #fda4af;
      text-decoration: underline;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 0.73rem;
      padding: 3px 8px;
      border-radius: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
      cursor: pointer;
    }

    .tag:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    .card-footer {
      padding: 13px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 9, 11, 0.45);
      gap: 8px;
    }

    .price-current {
      font-size: 1.12rem;
      font-weight: 800;
    }

    .price-orig {
      font-size: 0.76rem;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-left: 5px;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn.active {
      border-color: rgba(225, 29, 72, 0.5);
      background: rgba(225, 29, 72, 0.15);
      color: var(--accent);
    }

    .sub-btn {
      padding: 7px 10px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .sub-btn:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    .primary-btn {
      padding: 8px 13px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .primary-btn:hover {
      opacity: 0.92;
    }

    /* Load More Button */
    .load-more-wrap {
      margin-top: 32px;
      text-align: center;
    }

    .load-more-btn {
      padding: 12px 32px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .load-more-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    /* Creator Card */
    .creator-thumb {
      width: 68px;
      height: 68px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    /* Sample Preview Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 860px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      font-size: 0.98rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-close {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sample-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .sample-img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      display: block;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg);
    }

    @media (max-width: 640px) {
      .search-box {
        width: 100%;
      }
      .tab-btn {
        padding: 12px 14px;
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body>

  <!-- 1. サイトヘッダー -->
  <header class="header">
    <div class="container header-top">
      <div class="brand-group">
        <button type="button" class="brand" id="logoReset">
          <span class="brand-bar"></span>
          <div>
            <span class="brand-name">DOUJIN INDEX</span>
            <span class="brand-sub">FANZA同人 新着・ランキング・有名作家まとめ</span>
          </div>
        </button>
        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="liveStatusText">データ読み込み中...</span>
        </div>
      </div>

      <div class="header-controls">
        <select id="linkModeSelect" class="link-mode-select" title="FANZAへの遷移方式を切り替えできます">
          <option value="af_001">リンク設定: 通常アフィリエイト (douzinINFO-001)</option>
          <option value="af_990">リンク設定: APIアフィリエイト (douzinINFO-990)</option>
          <option value="direct">リンク設定: FANZA作品ページ直リンク (広告ブロック回避)</option>
        </select>

        <div class="search-box">
          <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="作品名・作家・サークル・タグで検索..." />
        </div>
      </div>
    </div>
  </header>

  <!-- 2. メインタブバー（5つの明確なタブ） -->
  <div class="tab-bar">
    <div class="container">
      <nav class="tab-list" aria-label="メインタブ">
        <button type="button" class="tab-btn active" data-tab="new">
          <span>新着作品</span>
          <span id="totalWorksCount" class="count-pill">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="ranking">人気ランキング</button>
        <button type="button" class="tab-btn" data-tab="creators">
          <span>有名作家・サークル別</span>
          <span id="totalCreatorsCount" class="count-pill">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="sale">
          <span>セール・割引中</span>
          <span id="saleWorksCount" class="count-pill">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="favorites">
          <span>お気に入り</span>
          <span id="favCount" class="count-pill">0</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- 3. ジャンル切り替え ＆ 並び替えバー -->
  <div class="subbar" id="subBar">
    <div class="container subbar-inner">
      <div class="cat-segment">
        <button type="button" class="cat-btn active" data-cat="all">すべて <span class="cat-count" id="catCountAll"></span></button>
        <button type="button" class="cat-btn" data-cat="comic">同人誌・漫画 <span class="cat-count" id="catCountComic"></span></button>
        <button type="button" class="cat-btn" data-cat="audio">同人音声・ASMR <span class="cat-count" id="catCountAudio"></span></button>
        <button type="button" class="cat-btn" data-cat="cg">CG・イラスト集 <span class="cat-count" id="catCountCg"></span></button>
        <button type="button" class="cat-btn" data-cat="game">ゲーム・動画 <span class="cat-count" id="catCountGame"></span></button>
      </div>

      <div class="sort-wrap" id="sortWrap">
        <span class="result-summary" id="resultSummary"></span>
        <span>並び順:</span>
        <select id="sortSelect" class="select-box">
          <option value="newest">配信日が新しい順</option>
          <option value="popular">人気・レビュー順</option>
          <option value="priceAsc">価格が安い順</option>
        </select>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="filterNotice" class="filter-notice">
      <div>
        <span style="color:#fda4af; font-weight:700; margin-right:8px;">絞り込み表示中:</span>
        <strong id="filterNoticeText"></strong>
      </div>
      <button type="button" id="clearFilterBtn" style="background:var(--surface); border:1px solid var(--border); padding:5px 12px; border-radius:6px; cursor:pointer; font-size:0.8rem; font-weight:600;">
        ✕ 絞り込みを解除
      </button>
    </div>

    <div id="mainView"></div>
  </main>

  <!-- 4. サンプル立ち読み・プレビュー用モーダル -->
  <div class="modal-backdrop" id="sampleModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">サンプルプレビュー</h3>
        <button type="button" class="modal-close" id="closeModalBtn">✕ 閉じる</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <div id="modalPriceInfo"></div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <a href="#" target="_blank" rel="noopener" class="sub-btn" id="modalDirectLink">
            直リンクで開く
          </a>
          <a href="#" target="_blank" rel="noopener" class="primary-btn" id="modalFanzaLink" style="padding:10px 18px; font-size:0.86rem;">
            FANZA公式ページで見る ↗
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- ローカル直開き(file://)でも即時反映される実データスクリプト -->
  <script src="./data/fanza_latest.js"></script>

  <script>
    const CATEGORY_META = {
      comic: { label: "同人誌・漫画" },
      audio: { label: "同人音声・ASMR" },
      cg: { label: "CG・イラスト集" },
      game: { label: "ゲーム・動画" }
    };

    function normalizeWorkOnClient(w) {
      const url = String(w.imageUrl || "");
      let category = w.category || "comic";
      if (url.includes("/digital/voice/")) category = "audio";
      else if (url.includes("/digital/comic/")) category = "comic";
      else if (url.includes("/digital/cg/")) category = "cg";
      else if (url.includes("/digital/game/")) category = "game";

      let spec = String(w.spec || "").trim();
      if (/^\d+$/.test(spec)) {
        spec = category === "comic" ? `漫画 ${spec}P` : category === "cg" ? `CG ${spec}枚` : `${spec}P`;
      } else if (!spec || spec === "同人誌" || spec === "ボイス・ASMR") {
        spec = (CATEGORY_META[category] || CATEGORY_META.comic).label;
      }

      return {
        ...w,
        category,
        spec,
        tags: Array.isArray(w.tags) ? w.tags : [],
        sampleImages: Array.isArray(w.sampleImages) ? w.sampleImages : []
      };
    }

    let WORKS = [];
    let CREATORS = [];

    function applyDataset(data) {
      if (!data || !Array.isArray(data.works) || data.works.length === 0) return false;
      WORKS = data.works.map(normalizeWorkOnClient);
      if (Array.isArray(data.creators) && data.creators.length > 0) {
        CREATORS = data.creators.map((c) => {
          const url = String(c.imageUrl || "");
          let cat = c.category || "comic";
          if (url.includes("/digital/voice/")) cat = "audio";
          else if (url.includes("/digital/comic/")) cat = "comic";
          else if (url.includes("/digital/cg/")) cat = "cg";
          else if (url.includes("/digital/game/")) cat = "game";
          return { ...c, category: cat };
        });
      }
      document.getElementById("liveStatusText").textContent = `FANZA実データ反映済み (${WORKS.length}作品 / ${CREATORS.length}サークル)`;
      return true;
    }

    if (window.FANZA_LIVE_DATA) {
      applyDataset(window.FANZA_LIVE_DATA);
    }

    const state = {
      tab: "new",
      cat: "all",
      sort: "newest",
      linkMode: "af_001", // 'af_001' | 'af_990' | 'direct'
      creatorId: null,
      tag: null,
      query: "",
      limit: 24,
      favs: []
    };

    /**
     * 作品コードと選択中のリンクモードから遷移先URLを生成する
     * - af_001: 通常サイト用アフィリエイトID (douzinINFO-001)
     * - af_990: API用アフィリエイトID (douzinINFO-990)
     * - direct: FANZA同人 作品詳細ページ直リンク（AdBlock等によるal.fanza.co.jp遮断を100%回避）
     */
    function buildFanzaUrl(w, modeOverride) {
      const code = w.code || w.id;
      const directUrl = `https://www.dmm.co.jp/dc/doujin/-/detail/=/cid=${code}/`;
      const mode = modeOverride || state.linkMode;

      if (mode === "direct") {
        return directUrl;
      }
      if (mode === "af_001") {
        const rawAf = w.affiliateUrl || "";
        if (rawAf.includes("af_id=")) {
          return rawAf.replace(/af_id=[^&]+/, "af_id=douzinINFO-001");
        }
        return `https://al.fanza.co.jp/?lurl=${encodeURIComponent(directUrl)}&af_id=douzinINFO-001&ch=link_tool&ch_id=link`;
      }
      // af_990
      return w.affiliateUrl || `https://al.fanza.co.jp/?lurl=${encodeURIComponent(directUrl)}&af_id=douzinINFO-990&ch=api`;
    }

    async function tryFetchLiveFanzaData() {
      try {
        const res = await fetch("./data/fanza_latest.json", { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.works) && data.works.length >= WORKS.length) {
            applyDataset(data);
            render();
          }
        }
      } catch (e) {}

      try {
        const res = await fetch("/api/fanza");
        if (res.ok) {
          const data = await res.json();
          if (data && data.mode === "live" && Array.isArray(data.works) && data.works.length > WORKS.length) {
            applyDataset(data);
            render();
          }
        }
      } catch (e) {}
    }

    function updateCounters() {
      document.getElementById("totalWorksCount").textContent = WORKS.length;
      document.getElementById("totalCreatorsCount").textContent = CREATORS.length;
      document.getElementById("saleWorksCount").textContent = WORKS.filter((w) => w.discount > 0).length;
      document.getElementById("favCount").textContent = state.favs.length;

      const counts = { all: WORKS.length, comic: 0, audio: 0, cg: 0, game: 0 };
      WORKS.forEach((w) => {
        counts[w.category] = (counts[w.category] || 0) + 1;
      });
      document.getElementById("catCountAll").textContent = `(${counts.all})`;
      document.getElementById("catCountComic").textContent = `(${counts.comic})`;
      document.getElementById("catCountAudio").textContent = `(${counts.audio})`;
      document.getElementById("catCountCg").textContent = `(${counts.cg})`;
      document.getElementById("catCountGame").textContent = `(${counts.game})`;
    }

    function renderCard(w, displayRank) {
      const isFav = state.favs.includes(w.id);
      const fanzaUrl = buildFanzaUrl(w);
      const directUrl = buildFanzaUrl(w, "direct");
      const coverStyle = w.imageUrl
        ? `background-image:url('${w.imageUrl}'); background-color:#18181b;`
        : `background:#27272a;`;
      const sampleCount = (w.sampleImages || []).length;

      return `
        <article class="card">
          <div>
            <div class="card-cover" style="${coverStyle}" data-preview="${w.id}" title="クリックでサンプル画像をプレビュー">
              <div class="cover-top">
                <div>
                  ${displayRank ? `<span class="rank-badge">${displayRank}位</span>` : ""}
                  <span class="type-label">${(CATEGORY_META[w.category] || CATEGORY_META.comic).label}</span>
                </div>
                ${w.discount > 0 ? `<span class="discount-badge">${w.discount}%OFF</span>` : ""}
              </div>
              <div class="cover-bottom">
                <span class="mono-meta">${w.spec}</span>
                <span class="mono-meta">${w.date}</span>
              </div>
            </div>

            <div class="card-body">
              <div class="circle-row">
                <button type="button" class="circle-link" data-creator="${w.creatorId}">${w.circle}</button>
                <span class="rating-meta">★ ${Number(w.rating || 4.5).toFixed(2)}${w.reviewsCount ? ` (${w.reviewsCount})` : ""}</span>
              </div>
              <a href="${fanzaUrl}" target="_blank" rel="noopener" class="card-title-link" title="${w.title}">${w.title}</a>
              <div class="tags">
                ${(w.tags || []).slice(0, 5).map((t) => `<button type="button" class="tag" data-tag="${t}">#${t}</button>`).join("")}
              </div>
            </div>
          </div>

          <div class="card-footer">
            <div>
              <span class="price-current">¥${Number(w.price || 0).toLocaleString()}</span>
              ${w.discount > 0 ? `<span class="price-orig">¥${Number(w.origPrice || 0).toLocaleString()}</span>` : ""}
            </div>
            <div class="footer-actions">
              ${sampleCount > 0 ? `<button type="button" class="sub-btn" data-preview="${w.id}">サンプル(${sampleCount})</button>` : ""}
              <a href="${directUrl}" target="_blank" rel="noopener" class="sub-btn" title="広告ブロッカー等で飛べない場合の直リンク">直リンク</a>
              <button type="button" class="icon-btn ${isFav ? "active" : ""}" data-fav="${w.id}" title="お気に入り保存">
                <svg width="16" height="16" fill="${isFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
              </button>
              <a href="${fanzaUrl}" target="_blank" rel="noopener" class="primary-btn">FANZAで見る ↗</a>
            </div>
          </div>
        </article>
      `;
    }

    function render() {
      updateCounters();

      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
      document.querySelectorAll(".cat-btn").forEach((b) => b.classList.toggle("active", b.dataset.cat === state.cat));

      const notice = document.getElementById("filterNotice");
      if (state.creatorId || state.tag) {
        notice.style.display = "flex";
        const c = state.creatorId ? CREATORS.find((x) => x.id === state.creatorId) : null;
        const cName = c ? c.circle : (WORKS.find((w) => w.creatorId === state.creatorId)?.circle || state.creatorId);
        document.getElementById("filterNoticeText").textContent = [state.creatorId ? `サークル: ${cName}` : "", state.tag ? `タグ: #${state.tag}` : ""].filter(Boolean).join(" / ");
      } else {
        notice.style.display = "none";
      }

      const view = document.getElementById("mainView");
      const sortWrap = document.getElementById("sortWrap");

      if (state.tab === "creators") {
        sortWrap.style.display = "none";
        const creatorList = CREATORS.filter((c) => {
          if (state.cat !== "all" && c.category && c.category !== state.cat) return false;
          if (state.query) {
            const q = state.query.toLowerCase();
            return (c.name || "").toLowerCase().includes(q) || (c.circle || "").toLowerCase().includes(q) || (c.bio || "").toLowerCase().includes(q);
          }
          return true;
        });

        view.innerHTML = `
          <div class="grid">
            ${creatorList
              .map(
                (c) => `
              <div class="card" style="padding:20px; gap:14px;">
                <div style="display:flex; gap:14px; align-items:flex-start;">
                  ${c.imageUrl ? `<img src="${c.imageUrl}" alt="${c.circle}" class="creator-thumb" loading="lazy" />` : ""}
                  <div style="flex:1; min-width:0;">
                    <div style="display:flex; justify-content:space-between; font-size:0.74rem; color:var(--text-muted); margin-bottom:6px;">
                      <span style="padding:2px 8px; border-radius:4px; background:var(--bg); border:1px solid var(--border); color:var(--text-sub); font-weight:600;">${(CATEGORY_META[c.category] || CATEGORY_META.comic).label}</span>
                      <span>最新: ${c.latest || "-"}</span>
                    </div>
                    <h3 style="font-size:1.02rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${c.circle}</h3>
                    <p style="font-size:0.81rem; color:var(--text-sub); margin-top:6px; line-height:1.45;">${c.bio || ""}</p>
                  </div>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:12px; border-top:1px solid var(--border);">
                  <span style="font-size:0.8rem; color:var(--text-sub);">収録数: <strong style="color:var(--text);">${c.works}作品</strong></span>
                  <button type="button" class="primary-btn" data-creator="${c.id}">作品一覧を見る →</button>
                </div>
              </div>
            `
              )
              .join("")}
          </div>
        `;
        return;
      }

      sortWrap.style.display = "flex";

      let list = WORKS.filter((w) => {
        if (state.tab === "favorites" && !state.favs.includes(w.id)) return false;
        if (state.tab === "sale" && w.discount <= 0) return false;
        if (state.cat !== "all" && w.category !== state.cat) return false;
        if (state.creatorId && w.creatorId !== state.creatorId) return false;
        if (state.tag && !(w.tags || []).includes(state.tag)) return false;
        if (state.query) {
          const q = state.query.toLowerCase();
          return (
            (w.title || "").toLowerCase().includes(q) ||
            (w.author || "").toLowerCase().includes(q) ||
            (w.circle || "").toLowerCase().includes(q) ||
            (w.tags || []).some((t) => t.toLowerCase().includes(q))
          );
        }
        return true;
      });

      if (state.tab === "ranking") {
        list.sort((a, b) => (a.rank || 999) - (b.rank || 999) || (b.dlCount || 0) - (a.dlCount || 0));
      } else if (state.sort === "popular") {
        list.sort((a, b) => (b.dlCount || 0) - (a.dlCount || 0));
      } else if (state.sort === "priceAsc") {
        list.sort((a, b) => (a.price || 0) - (b.price || 0));
      } else {
        list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      }

      document.getElementById("resultSummary").textContent = `全 ${list.length} 件`;

      const visibleList = list.slice(0, state.limit);
      const hasMore = list.length > state.limit;

      if (visibleList.length === 0) {
        view.innerHTML = `
          <div style="text-align:center; padding:60px 20px; background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--text-sub);">
            該当する作品が見つかりませんでした。検索条件やジャンルを変更してお試しください。
          </div>
        `;
        return;
      }

      view.innerHTML = `
        <div class="grid">
          ${visibleList.map((w, idx) => renderCard(w, state.tab === "ranking" ? idx + 1 : null)).join("")}
        </div>
        ${
          hasMore
            ? `<div class="load-more-wrap">
                <button type="button" class="load-more-btn" id="loadMoreBtn">
                  さらに作品を表示する（残り ${list.length - state.limit} 件）
                </button>
              </div>`
            : ""
        }
      `;
    }

    function openPreviewModal(workId) {
      const w = WORKS.find((x) => x.id === workId);
      if (!w) return;
      const modal = document.getElementById("sampleModal");
      document.getElementById("modalTitle").textContent = `${w.title} — ${w.circle}`;
      document.getElementById("modalFanzaLink").href = buildFanzaUrl(w);
      document.getElementById("modalDirectLink").href = buildFanzaUrl(w, "direct");
      document.getElementById("modalPriceInfo").innerHTML = `
        <span style="font-size:1.15rem; font-weight:800;">¥${Number(w.price || 0).toLocaleString()}</span>
        ${w.discount > 0 ? `<span style="color:var(--text-muted); text-decoration:line-through; margin-left:8px; font-size:0.85rem;">¥${Number(w.origPrice || 0).toLocaleString()}</span> <span class="discount-badge" style="margin-left:6px;">${w.discount}%OFF</span>` : ""}
      `;

      const images = w.sampleImages && w.sampleImages.length > 0 ? w.sampleImages : w.imageUrl ? [w.imageUrl] : [];
      document.getElementById("modalBody").innerHTML = `
        <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:0.82rem; color:var(--text-sub);">
          <span style="padding:3px 10px; border-radius:6px; background:var(--bg); border:1px solid var(--border); color:var(--text);">${(CATEGORY_META[w.category] || CATEGORY_META.comic).label}</span>
          <span>サークル: <strong style="color:var(--text);">${w.circle}</strong></span>
          <span>仕様: ${w.spec}</span>
          <span>配信日: ${w.date}</span>
        </div>
        <div class="sample-gallery">
          ${images.map((src, i) => `<img src="${src}" alt="サンプル ${i + 1}" class="sample-img" loading="lazy" />`).join("")}
        </div>
      `;
      modal.classList.add("open");
    }

    document.addEventListener("click", (e) => {
      // <a>タグのクリックは一切妨害せずブラウザ標準の遷移に任せる
      if (e.target.closest("a")) return;

      const tab = e.target.closest("[data-tab]");
      if (tab) {
        state.tab = tab.dataset.tab;
        state.limit = 24;
        render();
        return;
      }
      const cat = e.target.closest("[data-cat]");
      if (cat) {
        state.cat = cat.dataset.cat;
        state.limit = 24;
        render();
        return;
      }
      const creator = e.target.closest("[data-creator]");
      if (creator) {
        state.creatorId = creator.dataset.creator;
        state.tab = "new";
        state.cat = "all";
        state.limit = 24;
        render();
        return;
      }
      const tag = e.target.closest("[data-tag]");
      if (tag) {
        state.tag = state.tag === tag.dataset.tag ? null : tag.dataset.tag;
        state.tab = "new";
        state.limit = 24;
        render();
        return;
      }
      const fav = e.target.closest("[data-fav]");
      if (fav) {
        const id = fav.dataset.fav;
        const i = state.favs.indexOf(id);
        if (i >= 0) state.favs.splice(i, 1);
        else state.favs.push(id);
        render();
        return;
      }
      const preview = e.target.closest("[data-preview]");
      if (preview) {
        openPreviewModal(preview.dataset.preview);
        return;
      }
      if (e.target.closest("#loadMoreBtn")) {
        state.limit += 36;
        render();
        return;
      }
      if (e.target.closest("#closeModalBtn") || e.target.id === "sampleModal") {
        document.getElementById("sampleModal").classList.remove("open");
        return;
      }
      if (e.target.closest("#clearFilterBtn") || e.target.closest("#logoReset")) {
        state.creatorId = null;
        state.tag = null;
        state.cat = "all";
        state.query = "";
        state.tab = "new";
        state.limit = 24;
        document.getElementById("searchInput").value = "";
        render();
      }
    });

    document.getElementById("linkModeSelect").addEventListener("change", (e) => {
      state.linkMode = e.target.value;
      render();
    });

    document.getElementById("sortSelect").addEventListener("change", (e) => {
      state.sort = e.target.value;
      state.limit = 24;
      render();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.query = e.target.value.trim();
      state.limit = 24;
      render();
    });

    render();
    tryFetchLiveFanzaData();
  </script>
</body>
</html>
