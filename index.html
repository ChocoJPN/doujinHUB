    // 1) Cloudflare Pages Functions (/api/fanza) または 2) GitHub Actions 自動更新JSON (./data/fanza_latest.json) から実データを取得
    async function tryFetchLiveFanzaData() {
      // 1. Cloudflare Pages Functions のリアルタイムAPIを試行
      try {
        const res = await fetch("/api/fanza?sort=date&hits=40");
        if (res.ok) {
          const data = await res.json();
          if (data && data.mode === "live" && Array.isArray(data.works) && data.works.length > 0) {

            const badge = document.getElementById("apiStatusBadge");

              badge.classList.add("live");
            }
            render();
            return;

              CREATORS = data.creators;
            }
            const badge = document.getElementById("apiStatusBadge");
            if (badge) {
              badge.textContent = "AUTO UPDATED";
              badge.classList.add("live");
            }
            render();
          }
        }
      } catch (e) {}
    }

    function computeAnalytics(worksList) {
      if (!worksList.length) return null;
      let priceSum = 0;
      let ratingSum = 0;
      let saleCount = 0;
      const catCounts = { comic: 0, audio: 0, cg: 0 };
      const tagMap = new Map();

      worksList.forEach((w) => {
        priceSum += w.price;
        ratingSum += w.rating;
        if (w.discount > 0) saleCount++;
        catCounts[w.category] = (catCounts[w.category] || 0) + 1;
        w.tags.forEach((t) => {
          const cur = tagMap.get(t) || { name: t, count: 0, priceSum: 0 };
          cur.count++;
          cur.priceSum += w.price;
          tagMap.set(t, cur);
        });
      });

      const topTags = Array.from(tagMap.values())
        .sort((a, b) => b.count - a.count)
        .slice(0, 8);

      return {
        total: worksList.length,
        avgPrice: Math.round(priceSum / worksList.length),
        avgRating: (ratingSum / worksList.length).toFixed(2),
        saleRatio: Math.round((saleCount / worksList.length) * 100),
        catCounts,
        topTags
      };
    }

    function renderAnalyticsView() {
      const stats = computeAnalytics(WORKS);
      if (!stats) return `<p>データがありません。</p>`;

      return `
        <div style="margin-top:24px;">
          <div class="kpi-grid">
            <div class="kpi-card">
              <div class="kpi-label">分析対象作品数</div>
              <div class="kpi-value">${stats.total} <span style="font-size:0.85rem; font-weight:400; color:var(--text-sub);">works</span></div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">平均販売価格</div>
              <div class="kpi-value">¥${stats.avgPrice.toLocaleString()}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">セール実施率</div>
              <div class="kpi-value">${stats.saleRatio}%</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">平均レビュースコア</div>
              <div class="kpi-value">★ ${stats.avgRating}</div>
            </div>
          </div>

          <div class="analytics-panels">
            <div class="panel">
              <h3 class="panel-title">カテゴリ別シェア</h3>
              ${["comic", "audio", "cg"]
                .map((cid) => {
                  const cnt = stats.catCounts[cid] || 0;
                  const pct = Math.round((cnt / stats.total) * 100);
                  return `
                    <div class="bar-row">
                      <div class="bar-head">
                        <span>${CATEGORY_META[cid].ja}</span>
                        <span class="mono-meta">${cnt}件 (${pct}%)</span>
                      </div>
                      <div class="bar-track">
                        <div class="bar-fill" style="width:${pct}%;"></div>
                      </div>
                    </div>
                  `;
                })
                .join("")}
            </div>

            <div class="panel">
              <h3 class="panel-title">頻出タグ・ジャンル別 平均価格分析</h3>
              ${stats.topTags
                .map((t) => {
                  const avg = Math.round(t.priceSum / t.count);
                  const pct = Math.min(100, Math.round((t.count / stats.total) * 100 * 1.8));
                  return `
                    <div class="bar-row">
                      <div class="bar-head">
                        <button type="button" class="circle-link" data-tag="${t.name}">#${t.name}</button>
                        <span class="mono-meta">${t.count}作品 · 平均 ¥${avg.toLocaleString()}</span>
                      </div>
                      <div class="bar-track">
                        <div class="bar-fill" style="width:${pct}%; background:var(--accent);"></div>
                      </div>
                    </div>
                  `;
                })
                .join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderCard(w, isRanking) {
      const isFav = state.favs.includes(w.id);
      const fanzaUrl = w.affiliateUrl || `https://www.dmm.co.jp/dc/doujin/-/detail/=/cid=${w.code}/`;
      const coverStyle = w.imageUrl
        ? `background-image:url('${w.imageUrl}'); background-color:#18181b;`
        : `background:${w.accent || "#27272a"};`;

      return `
        <article class="card">
          <div>
            <div class="card-cover" style="${coverStyle}">
              <div class="cover-top">
                <div>
                  ${isRanking ? `<span class="rank-badge">#${w.rank}</span>` : ""}
                  <span class="type-label">${(CATEGORY_META[w.category] || CATEGORY_META.comic).label}</span>
                </div>
                ${w.discount > 0 ? `<span class="discount-badge">-${w.discount}%</span>` : ""}
              </div>
              <div class="cover-bottom">
                <span class="mono-meta">${w.spec}</span>
                <span class="mono-meta">${w.date}</span>
              </div>
            </div>

            <div class="card-body">
              <div class="circle-row">
                <button type="button" class="circle-link" data-creator="${w.creatorId}">${w.circle} / ${w.author}</button>
                <span class="mono-meta">★ ${Number(w.rating).toFixed(2)}</span>
              </div>
              <h3 class="card-title">${w.title}</h3>
              <div class="tags">
                ${w.tags.map((t) => `<button type="button" class="tag" data-tag="${t}">#${t}</button>`).join("")}
              </div>
            </div>
          </div>

          <div class="card-footer">
            <div>
              <span class="price-current">¥${w.price.toLocaleString()}</span>
              ${w.discount > 0 ? `<span class="price-orig">¥${w.origPrice.toLocaleString()}</span>` : ""}
            </div>
            <div class="footer-actions">
              <button type="button" class="icon-btn ${isFav ? "active" : ""}" data-fav="${w.id}" title="ブックマーク">
                <svg width="15" height="15" fill="${isFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
              </button>
              <a href="${fanzaUrl}" target="_blank" rel="noopener noreferrer" class="primary-btn">FANZAで見る</a>
            </div>
          </div>
        </article>
      `;
    }

    function render() {
      document.getElementById("favCount").textContent = state.favs.length;
      document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
      document.querySelectorAll(".cat-btn").forEach((b) => b.classList.toggle("active", b.dataset.cat === state.cat));

      const notice = document.getElementById("filterNotice");
      if (state.creatorId || state.tag) {
        notice.style.display = "flex";
        const c = state.creatorId ? CREATORS.find((x) => x.id === state.creatorId) : null;
        document.getElementById("filterNoticeText").textContent = [c ? `${c.circle} (${c.name})` : "", state.tag ? `#${state.tag}` : ""].filter(Boolean).join(" / ");
      } else {
        notice.style.display = "none";
      }

      const view = document.getElementById("mainView");
      const subBar = document.getElementById("subBar");

      if (state.tab === "analytics") {
        subBar.style.display = "none";
        view.innerHTML = renderAnalyticsView();
        return;
      }

      if (state.tab === "creators") {
        subBar.style.display = "none";
        view.innerHTML = `
          <div class="grid" style="margin-top:24px;">
            ${CREATORS.map(
              (c) => `
              <div class="card" style="padding:20px; gap:14px;">
                <div>
                  <div style="display:flex; justify-content:space-between; font-size:0.74rem; color:var(--text-muted); margin-bottom:6px;">
                    <span class="mono-meta">${c.cat}</span>
                    <span class="mono-meta">最終更新: ${c.latest}</span>
                  </div>
                  <h3 style="font-size:1.02rem; font-weight:700;">${c.circle} <span style="font-weight:400; font-size:0.85rem; color:var(--text-sub);">/ ${c.name}</span></h3>
                  <p style="font-size:0.82rem; color:var(--text-sub); margin-top:8px;">${c.bio}</p>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:12px; border-top:1px solid var(--border);">
                  <span class="mono-meta" style="color:var(--text-muted);">${c.works} Works</span>
                  <button type="button" class="primary-btn" data-creator="${c.id}">作品一覧を見る →</button>
                </div>
              </div>
            `
            ).join("")}
          </div>
        `;
        return;
      }

      subBar.style.display = "block";

      let list = WORKS.filter((w) => {
        if (state.tab === "favorites" && !state.favs.includes(w.id)) return false;
        if (state.cat !== "all" && w.category !== state.cat) return false;
        if (state.saleOnly && w.discount <= 0) return false;
        if (state.creatorId && w.creatorId !== state.creatorId) return false;
        if (state.tag && !w.tags.includes(state.tag)) return false;
        if (state.query) {
          const q = state.query.toLowerCase();
          return w.title.toLowerCase().includes(q) || w.author.toLowerCase().includes(q) || w.circle.toLowerCase().includes(q) || w.tags.some((t) => t.toLowerCase().includes(q));
        }
        return true;
      });

      if (state.tab === "ranking") list.sort((a, b) => a.rank - b.rank);
      else if (state.sort === "popular") list.sort((a, b) => b.dlCount - a.dlCount);
      else if (state.sort === "priceAsc") list.sort((a, b) => a.price - b.price);
      else list.sort((a, b) => b.date.localeCompare(a.date));

      view.innerHTML = `<div class="grid">${list.map((w) => renderCard(w, state.tab === "ranking")).join("")}</div>`;
    }

    document.addEventListener("click", (e) => {
      const tab = e.target.closest("[data-tab]");
      if (tab) {
        state.tab = tab.dataset.tab;
        render();
        return;
      }
      const cat = e.target.closest("[data-cat]");
      if (cat) {
        state.cat = cat.dataset.cat;
        render();
        return;
      }
      const creator = e.target.closest("[data-creator]");
      if (creator) {
        state.creatorId = creator.dataset.creator;
        state.tab = "new";
        render();
        return;
      }
      const tag = e.target.closest("[data-tag]");
      if (tag) {
        state.tag = state.tag === tag.dataset.tag ? null : tag.dataset.tag;
        state.tab = "new";
        render();
        return;
      }
      const fav = e.target.closest("[data-fav]");
      if (fav) {
        const id = fav.dataset.fav;
        const i = state.favs.indexOf(id);
        if (i >= 0) state.favs.splice(i, 1);
        else state.favs.push(id);
        render();
        return;
      }
      if (e.target.closest("#clearFilterBtn") || e.target.closest("#logoReset")) {
        state.creatorId = null;
        state.tag = null;
        state.cat = "all";
        state.saleOnly = false;
        state.query = "";
        state.tab = "new";
        document.getElementById("saleCheck").checked = false;
        document.getElementById("searchInput").value = "";
        render();
      }
    });

    document.getElementById("saleCheck").addEventListener("change", (e) => {
      state.saleOnly = e.target.checked;
      render();
    });

    document.getElementById("sortSelect").addEventListener("change", (e) => {
      state.sort = e.target.value;
      render();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.query = e.target.value.trim();
      render();
    });

    render();
    tryFetchLiveFanzaData();
  </script>
</body>
</html>
