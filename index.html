<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOUJIN INDEX — FANZA同人 新着・ランキング・有名作家まとめ</title>
  <meta name="description" content="FANZA同人の同人誌・同人音声(ASMR)・CG集の新着、人気ランキング、有名作家・サークル別まとめサイト。" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-hover: #18181c;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #fafafa;
      --text-sub: #a1a1aa;
      --text-muted: #71717a;
      --accent: #e11d48;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* 1. Top Header */
    .header {
      background: var(--surface);
      padding-top: 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
    }

    .brand-bar {
      width: 5px;
      height: 26px;
      background: var(--accent);
      border-radius: 2px;
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
      display: block;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--text-sub);
    }

    .search-box {
      position: relative;
      width: 300px;
      max-width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px 9px 36px;
      font-size: 0.85rem;
      color: var(--text);
      transition: border-color 0.15s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* 2. Main Tab Bar (大きく見やすい独立タブバー) */
    .tab-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18, 18, 21, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .tab-list {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 14px 20px;
      border: none;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.02);
    }

    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
      background: rgba(225, 29, 72, 0.06);
    }

    .count-pill {
      font-size: 0.74rem;
      padding: 1px 8px;
      border-radius: 99px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
    }

    /* 3. Sub Genre Bar (同人誌 / 同人音声 / CG集 のはっきりした切替) */
    .subbar {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin-bottom: 26px;
      background: var(--bg);
    }

    .subbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .cat-segment {
      display: inline-flex;
      padding: 4px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      gap: 4px;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 7px 16px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .cat-btn:hover {
      color: var(--text);
    }

    .cat-btn.active {
      background: var(--text);
      color: var(--bg);
      font-weight: 700;
    }

    .sort-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .select-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Active Filter Bar */
    .filter-notice {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(225, 29, 72, 0.1);
      border: 1px solid rgba(225, 29, 72, 0.35);
      border-radius: 10px;
      margin-bottom: 22px;
      font-size: 0.85rem;
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .card-cover {
      height: 150px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .card-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(9,9,11,0.5), rgba(9,9,11,0.75));
      pointer-events: none;
    }

    .cover-top, .cover-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .type-label {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.7);
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .rank-badge {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      background: #fafafa;
      color: #09090b;
      margin-right: 6px;
    }

    .discount-badge {
      font-size: 0.76rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
    }

    .mono-meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      color: #e4e4e7;
    }

    .card-body {
      padding: 18px;
    }

    .circle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .circle-link {
      background: none;
      border: none;
      color: var(--text-sub);
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-align: left;
    }

    .circle-link:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
      cursor: pointer;
    }

    .tag:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    .card-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 9, 11, 0.45);
    }

    .price-current {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .price-orig {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-left: 6px;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn.active {
      border-color: rgba(225, 29, 72, 0.5);
      background: rgba(225, 29, 72, 0.15);
      color: var(--accent);
    }

    .primary-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--text);
      color: var(--bg);
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    @media (max-width: 640px) {
      .search-box {
        width: 100%;
      }
      .tab-btn {
        padding: 12px 14px;
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body>

  <!-- 1. サイトヘッダー -->

      { id: "c2", name: "CV: 白雪みう", circle: "星空サウンドラボ", category: "audio", works: 48, latest: "2026.11.04", bio: "NEUMANN KU100マイクを用いた高精細バイノーラル録音に特化。耳かき・添い寝ボイス作品でランキング常連。" },
      { id: "c3", name: "琥珀クロエ", circle: "琥珀亭", category: "comic", works: 27, latest: "2026.11.02", bio: "緻密な世界観設計と重厚なストーリー展開で人気のファンタジー系同人サークル。" },
      { id: "c4", name: "結城ひなの・琴音りり", circle: "甘蜜ショコラティエ", category: "audio", works: 19, latest: "2026.11.03", bio: "左右独立チャンネルによるWキャスト掛け合い演出を得意とする音声制作サークル。" },
      { id: "c5", name: "蒼井ハルカ", circle: "蒼穹デジタルワークス", category: "cg", works: 41, latest: "2026.11.03", bio: "4K解像度のデジタルイラストとLive2Dアニメーションを組み合わせたハイブリッドCG集を制作。" },

    let WORKS = [

      {

        category: "audio",

      {

    const state = {
      tab: "new", // 'new' | 'ranking' | 'creators' | 'sale' | 'favorites'
      cat: "all",
      sort: "newest",
      creatorId: null,
      tag: null,
      query: "",
      favs: ["w1", "w2"]
    };

    // Cloudflare Pages Functions (/api/fanza) または GitHub Actions 自動更新JSON (./data/fanza_latest.json) から実データを取得
    async function tryFetchLiveFanzaData() {
      try {
        const res = await fetch("/api/fanza?sort=date&hits=40");
        if (res.ok) {
          const data = await res.json();
          if (data && data.mode === "live" && Array.isArray(data.works) && data.works.length > 0) {
            WORKS = data.works;
            if (Array.isArray(data.creators) && data.creators.length > 0) {
              CREATORS = data.creators;
            }
            render();
            return;
          }
        }
      } catch (e) {}

      try {
        const res = await fetch("./data/fanza_latest.json");
        if (res.ok) {
          const data = await res.json();
          if (data && data.mode === "live" && Array.isArray(data.works) && data.works.length > 0) {
            WORKS = data.works;
            if (Array.isArray(data.creators) && data.creators.length > 0) {
              CREATORS = data.creators;
            }
            render();
          }
        }
      } catch (e) {}
    }

    function renderCard(w, isRanking) {
      const isFav = state.favs.includes(w.id);
      const fanzaUrl = w.affiliateUrl || `https://www.dmm.co.jp/dc/doujin/-/detail/=/cid=${w.code}/`;
      const coverStyle = w.imageUrl
        ? `background-image:url('${w.imageUrl}'); background-color:#18181b;`
        : `background:${w.accent || "#27272a"};`;

      return `
        <article class="card">
          <div>
            <div class="card-cover" style="${coverStyle}">
              <div class="cover-top">
                <div>
                  ${isRanking ? `<span class="rank-badge">${w.rank}位</span>` : ""}
                  <span class="type-label">${(CATEGORY_META[w.category] || CATEGORY_META.comic).label}</span>
                </div>
                ${w.discount > 0 ? `<span class="discount-badge">${w.discount}%OFF</span>` : ""}
              </div>
              <div class="cover-bottom">
                <span class="mono-meta">${w.spec}</span>
                <span class="mono-meta">${w.date}</span>
              </div>
            </div>

            <div class="card-body">
              <div class="circle-row">
                <button type="button" class="circle-link" data-creator="${w.creatorId}">${w.circle} / ${w.author}</button>
                <span class="mono-meta">★ ${Number(w.rating).toFixed(2)}</span>
              </div>
              <h3 class="card-title">${w.title}</h3>
              <div class="tags">
                ${w.tags.map((t) => `<button type="button" class="tag" data-tag="${t}">#${t}</button>`).join("")}
              </div>
            </div>
          </div>

          <div class="card-footer">
            <div>
              <span class="price-current">¥${w.price.toLocaleString()}</span>
              ${w.discount > 0 ? `<span class="price-orig">¥${w.origPrice.toLocaleString()}</span>` : ""}
            </div>
            <div class="footer-actions">
              <button type="button" class="icon-btn ${isFav ? "active" : ""}" data-fav="${w.id}" title="お気に入り保存">
                <svg width="16" height="16" fill="${isFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
              </button>
              <a href="${fanzaUrl}" target="_blank" rel="noopener noreferrer" class="primary-btn">FANZAで見る</a>
            </div>
          </div>
        </article>
      `;
    }

    function render() {
      document.getElementById("favCount").textContent = state.favs.length;
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
      document.querySelectorAll(".cat-btn").forEach((b) => b.classList.toggle("active", b.dataset.cat === state.cat));

      const notice = document.getElementById("filterNotice");
      if (state.creatorId || state.tag) {
        notice.style.display = "flex";
        const c = state.creatorId ? CREATORS.find((x) => x.id === state.creatorId) : null;
        document.getElementById("filterNoticeText").textContent = [c ? `作家/サークル: ${c.circle} (${c.name})` : "", state.tag ? `タグ: #${state.tag}` : ""].filter(Boolean).join(" / ");
      } else {
        notice.style.display = "none";
      }

      const view = document.getElementById("mainView");
      const sortWrap = document.getElementById("sortWrap");

      if (state.tab === "creators") {
        sortWrap.style.display = "none";
        const creatorList = CREATORS.filter((c) => {
          if (state.cat !== "all" && c.category && c.category !== state.cat) return false;
          if (state.query) {
            const q = state.query.toLowerCase();
            return c.name.toLowerCase().includes(q) || c.circle.toLowerCase().includes(q) || c.bio.toLowerCase().includes(q);
          }
          return true;
        });

        view.innerHTML = `
          <div class="grid">
            ${creatorList
              .map(
                (c) => `
              <div class="card" style="padding:22px; gap:14px;">
                <div>
                  <div style="display:flex; justify-content:space-between; font-size:0.76rem; color:var(--text-muted); margin-bottom:8px;">
                    <span style="padding:2px 8px; border-radius:4px; background:var(--bg); border:1px solid var(--border); color:var(--text-sub); font-weight:600;">${(CATEGORY_META[c.category] || CATEGORY_META.comic).label}</span>
                    <span class="mono-meta">最新作: ${c.latest}</span>
                  </div>
                  <h3 style="font-size:1.05rem; font-weight:700;">${c.circle} <span style="font-weight:400; font-size:0.86rem; color:var(--text-sub);">/ ${c.name}</span></h3>
                  <p style="font-size:0.84rem; color:var(--text-sub); margin-top:8px;">${c.bio}</p>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:14px; border-top:1px solid var(--border);">
                  <span style="font-size:0.8rem; color:var(--text-sub);">配信数: <strong style="color:var(--text);">${c.works}作品</strong></span>
                  <button type="button" class="primary-btn" data-creator="${c.id}">この作家の作品を見る →</button>
                </div>
              </div>
            `
              )
              .join("")}
          </div>
        `;
        return;
      }

      sortWrap.style.display = "flex";

      let list = WORKS.filter((w) => {
        if (state.tab === "favorites" && !state.favs.includes(w.id)) return false;
        if (state.tab === "sale" && w.discount <= 0) return false;
        if (state.cat !== "all" && w.category !== state.cat) return false;
        if (state.creatorId && w.creatorId !== state.creatorId) return false;
        if (state.tag && !w.tags.includes(state.tag)) return false;
        if (state.query) {
          const q = state.query.toLowerCase();
          return w.title.toLowerCase().includes(q) || w.author.toLowerCase().includes(q) || w.circle.toLowerCase().includes(q) || w.tags.some((t) => t.toLowerCase().includes(q));
        }
        return true;
      });

      if (state.tab === "ranking") list.sort((a, b) => a.rank - b.rank);
      else if (state.sort === "popular") list.sort((a, b) => b.dlCount - a.dlCount);
      else if (state.sort === "priceAsc") list.sort((a, b) => a.price - b.price);
      else list.sort((a, b) => b.date.localeCompare(a.date));

      view.innerHTML = `<div class="grid">${list.map((w) => renderCard(w, state.tab === "ranking")).join("")}</div>`;
    }

    document.addEventListener("click", (e) => {
      const tab = e.target.closest("[data-tab]");
      if (tab) {
        state.tab = tab.dataset.tab;
        render();
        return;
      }
      const cat = e.target.closest("[data-cat]");
      if (cat) {
        state.cat = cat.dataset.cat;
        render();
        return;
      }
      const creator = e.target.closest("[data-creator]");
      if (creator) {
        state.creatorId = creator.dataset.creator;
        state.tab = "new";
        render();
        return;
      }
      const tag = e.target.closest("[data-tag]");
      if (tag) {
        state.tag = state.tag === tag.dataset.tag ? null : tag.dataset.tag;
        state.tab = "new";
        render();
        return;
      }
      const fav = e.target.closest("[data-fav]");
      if (fav) {
        const id = fav.dataset.fav;
        const i = state.favs.indexOf(id);
        if (i >= 0) state.favs.splice(i, 1);
        else state.favs.push(id);
        render();
        return;
      }
      if (e.target.closest("#clearFilterBtn") || e.target.closest("#logoReset")) {
        state.creatorId = null;
        state.tag = null;
        state.cat = "all";
        state.query = "";
        state.tab = "new";
        document.getElementById("searchInput").value = "";
        render();
      }
    });

    document.getElementById("sortSelect").addEventListener("change", (e) => {
      state.sort = e.target.value;
      render();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.query = e.target.value.trim();
      render();
    });

    render();
    tryFetchLiveFanzaData();
  </script>
</body>
</html>
